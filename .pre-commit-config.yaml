# Install once per clone with: pre-commit install
# Keep the ruff rev in sync with the ruff pin in pyproject.toml ([project.optional-dependencies] dev).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
