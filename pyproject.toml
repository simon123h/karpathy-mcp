[project]
name = "karpathy-mcp"
version = "0.1.0"
description = "Configurable Markdown knowledge base MCP server backed by SQLite FTS5"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
mcp-markdown = "mcp_markdown.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff==0.15.2", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_markdown"]
